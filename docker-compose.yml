services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: acampabasquet
      POSTGRES_USER: acampabasquet
      POSTGRES_PASSWORD: acampabasquet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acampabasquet"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    environment:
      DJANGO_DATABASE_DEFAULT_HOST: db
      DJANGO_SETTINGS_MODULE: settings.dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
